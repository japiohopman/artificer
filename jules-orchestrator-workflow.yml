name: Jules Queue Orchestrator

# The "heartbeat": checks every 15 minutes whether the active Jules session's PR has been
# merged, and if so, dispatches the next unchecked task from ROADMAP.md's "## Now" list.
# See scripts/jules-orchestrator.mjs for the actual logic.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

permissions:
  contents: write # needed to commit the queue state file back to the repo
  pull-requests: read

concurrency:
  group: jules-orchestrator
  cancel-in-progress: false # never cancel a run mid-way; let it finish and commit cleanly

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run orchestrator
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update this if your Jules source name differs — see SETUP notes.
          JULES_SOURCE: sources/github/japiohopman/artificer
        run: node scripts/jules-orchestrator.mjs
