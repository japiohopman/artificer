name: Phase Safety Gate

# This is deliberately a second gate beside the normal CI workflow.
# CI answers: "does the repository build?"
# This workflow answers: "does a substantial PR carry the evidence needed for review?"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: phase-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phase-contract:
    name: Validate phase contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REF" = "main" ]; then
            echo "Safety gate failed: phase work must never target main directly."
            exit 1
          fi

          body="${PR_BODY:-}"
          title="${PR_TITLE:-}"

          # Require explicit issue reference in body, title, or branch name
          if ! grep -Eq '(Closes|Fixes|Resolves|Refs|Part of) #[0-9]+|#[0-9]+' <<< "$body $title $HEAD_REF"; then
            echo "Safety gate failed: PR must reference its governing GitHub Issue (for example: Closes #123, Refs #123, or Part of #123)."
            exit 1
          fi

          required_sections=(
            "## Phase"
            "## Goal"
            "## Scope completed"
            "## Safety / architecture"
            "## Verification"
            "## Data / content integrity"
            "## Documentation"
            "## Definition of Done"
          )

          missing=0
          for section in "${required_sections[@]}"; do
            if ! grep -Fq "$section" <<< "$body"; then
              echo "Safety gate notice: missing PR template section in body: $section"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "PR body missing template headers ($missing missing), but governing issue reference present in metadata."
          fi

          echo "Phase contract present and reviewable."

  repository-health:
    name: Repository health checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Validate game assets
        run: npm run validate:assets

      - name: Build
        run: npm run build
