
name: CI

# Runs on every push and pull request against main.
# Goal: catch a broken build before it reaches anyone else's session —
# this is the "minimal smoke-test / build check" from ROADMAP.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # Same as `npm run lint` — catches TypeScript/syntax errors like the
        # Token.tsx parse error that caused the white-screen crash.
        run: npm run lint

      - name: Validate game assets
        # Uses the project's own validateAssets.cjs — checks JSON validity,
        # index/filename consistency, and asset path existence.
        run: npm run validate:assets

      - name: Build
        # The real end-to-end check: if this fails, the app doesn't ship.
        run: npm run build
