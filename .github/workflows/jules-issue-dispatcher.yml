name: Jules Issue-First Dispatcher

# Issue #324: the first workflow that may create a real Jules session.
# Live creation requires explicit manual confirmation with the exact value DISPATCH.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DISPATCH to allow creation of one Jules session."
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: jules-issue-dispatcher
  cancel-in-progress: false

jobs:
  issue-first-dispatch:
    name: Issue-first Jules dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover Jules source
        id: source
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/jules-source-discovery.mjs

      - name: Reconcile Jules preflight
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_SOURCE: ${{ steps.source.outputs.source }}
        run: node scripts/jules-orchestrator-preflight.mjs

      - name: Stop when preflight blocks dispatch
        if: steps.preflight.outputs.dispatch != 'true'
        env:
          BLOCKING_SESSIONS: ${{ steps.preflight.outputs.blocking_sessions }}
          DECISION: ${{ steps.preflight.outputs.decision }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          echo "::notice::Issue-first dispatch is blocked by preflight."
          echo "Decision: $DECISION"
          echo "Blocking sessions:"
          printf "%s\n" "$BLOCKING_SESSIONS"
          if [ "$CONFIRMATION" = "DISPATCH" ]; then
            echo "::error::DISPATCH was explicitly requested, but preflight did not authorize session creation."
            exit 1
          fi

      - name: Build Issue-first selector payload
        id: selector
        if: steps.preflight.outputs.dispatch == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/jules-issue-selector.mjs > "$RUNNER_TEMP/jules-selector.json"
          cat "$RUNNER_TEMP/jules-selector.json"

      - name: Check selector dispatchability
        id: selector_gate
        if: steps.preflight.outputs.dispatch == 'true'
        env:
          SELECTOR: ${{ runner.temp }}/jules-selector.json
        run: |
          dispatchable="$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.SELECTOR,'utf8')); process.stdout.write(String(p.dispatchable === true))")"
          echo "dispatchable=$dispatchable" >> "$GITHUB_OUTPUT"
          if [ "$dispatchable" != "true" ]; then
            echo "::notice::No dispatchable Issue is available."
            cat "$SELECTOR"
            if [ "${{ inputs.confirmation }}" = "DISPATCH" ]; then
              echo "::error::DISPATCH was explicitly requested, but the Issue selector found no dispatchable Issue."
              exit 1
            fi
          fi

      - name: Live Jules session dispatch
        if: steps.preflight.outputs.dispatch == 'true' && steps.selector_gate.outputs.dispatchable == 'true' && inputs.confirmation == 'DISPATCH'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_SOURCE: ${{ steps.source.outputs.source }}
          JULES_SELECTOR_PAYLOAD: ${{ runner.temp }}/jules-selector.json
          JULES_DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/jules-issue-dispatch.mjs

      - name: Report dry-run only
        if: inputs.confirmation != 'DISPATCH'
        run: |
          echo "::notice::No live Jules session was created because confirmation was not exactly DISPATCH."

      - name: Report blocked or unavailable dispatch
        if: steps.preflight.outputs.dispatch == 'true' && steps.selector_gate.outputs.dispatchable != 'true'
        run: |
          echo "::notice::The Issue-first path completed without creating a Jules session."
