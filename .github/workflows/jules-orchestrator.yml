name: Jules Queue Orchestrator

# LEGACY PATH DISABLED during Issue #306 migration.
# This workflow is intentionally retained as a visible kill-switch so an accidental
# manual invocation cannot dispatch the old ROADMAP/TASK_BOARD-driven Jules queue.

on:
  workflow_dispatch: {}

permissions:
  contents: none
  pull-requests: none

concurrency:
  group: jules-orchestrator
  cancel-in-progress: false

jobs:
  legacy-dispatch-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy ROADMAP dispatcher is disabled
        run: |
          echo "::notice::Legacy ROADMAP → Jules dispatch is disabled during Issue #306."
          echo "No ROADMAP changes will be made."
          echo "No queue-state changes will be made."
          echo "No Jules API call will be made."
          echo "Use the new Issue-first workflow after the migration foundation is complete."
